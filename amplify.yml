version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npm install -g bun

    build:
      commands:
        - env | grep -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e CLOUDINARY_CLOUD_NAME -e CLOUDINARY_API_KEY -e CLOUDINARY_API_SECRET -e ADMIN_EMAIL -e ADMIN_PASSWORD >> .env.production
        - bun run prisma generate
        - bun run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
